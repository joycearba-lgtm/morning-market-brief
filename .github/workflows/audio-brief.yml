name: Daily Hebrew Audio

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Morning Market Brief]
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'macro_brief.json'
      - 'generate_audio.py'
      - 'audio_content.py'
      - 'publish_audio.py'
      - '.github/workflows/audio-brief.yml'
  schedule:
    # 09:30 local Israel; second UTC slot is skipped by the local-hour gate.
    - cron: '30 6 * * *'
    - cron: '30 7 * * *'

permissions:
  contents: write

concurrency:
  group: daily-hebrew-audio
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Israel audio time
        id: local_time
        shell: bash
        run: |
          OFFSET=$(TZ=Asia/Jerusalem date +%z)
          SCHEDULE="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ] || { [ "$OFFSET" = "+0300" ] && [ "$SCHEDULE" = "30 6 * * *" ]; } || { [ "$OFFSET" = "+0200" ] && [ "$SCHEDULE" = "30 7 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse an already matching recording
        id: recording
        if: steps.local_time.outputs.run == 'true'
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from publish_audio import matches
          try:
              brief=json.loads(Path('macro_brief.json').read_text())
              info=json.loads(Path('daily_audio.json').read_text())
              audio=Path('audio/morning-brief.mp3')
              ready=(matches(info,brief) and brief.get('date')==datetime.now(ZoneInfo('Asia/Jerusalem')).date().isoformat()
                     and audio.is_file() and audio.stat().st_size>1000)
          except (OSError,ValueError):
              ready=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready='+str(ready).lower()+'\n')
          PYCODE
      - name: Set up Python 3.12
        if: steps.local_time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free neural TTS runtime
        if: steps.local_time.outputs.run == 'true' && steps.recording.outputs.ready != 'true'
        id: install
        continue-on-error: true
        timeout-minutes: 9
        run: |
          python -m pip install -q 'git+https://github.com/maxmelichov/BlueTTS.git@0e38dbf' huggingface_hub soundfile numpy imageio-ffmpeg
          python -c 'from blue_onnx import BlueTTS; import imageio_ffmpeg; print("BlueTTS and FFmpeg ready", imageio_ffmpeg.get_ffmpeg_exe())'

      - name: Create daily audio file
        if: steps.local_time.outputs.run == 'true' && steps.recording.outputs.ready != 'true' && steps.install.outcome == 'success'
        id: synth
        continue-on-error: true
        timeout-minutes: 22
        run: python -u generate_audio.py

      - name: Publish recording or diagnostic status
        if: always() && !cancelled() && steps.local_time.outputs.run == 'true' && steps.recording.outputs.ready != 'true'
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SYNTH_OUTCOME: ${{ steps.synth.outcome }}
        run: python publish_audio.py
