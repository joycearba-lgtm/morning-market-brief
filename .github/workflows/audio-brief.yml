name: Daily Hebrew Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'macro_brief.json'
      - 'generate_audio.py'
      - '.github/workflows/audio-brief.yml'
  schedule:
    # 09:30 local Israel; second UTC slot is skipped by the local-hour gate.
    - cron: '30 6 * * *'
    - cron: '30 7 * * *'

permissions:
  contents: write

concurrency:
  group: daily-hebrew-audio
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check Israel audio time
        id: local_time
        shell: bash
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$HOUR" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python 3.12
        if: steps.local_time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free neural TTS runtime
        if: steps.local_time.outputs.run == 'true'
        run: |
          python -m pip install -q blue-onnx huggingface_hub soundfile numpy
          ffmpeg -version | head -n 1
      - name: Create daily audio file
        if: steps.local_time.outputs.run == 'true'
        run: python generate_audio.py
      - name: Publish recording if created
        if: steps.local_time.outputs.run == 'true'
        run: |
          if [ ! -s audio/morning-brief.mp3 ] || [ ! -f daily_audio.json ]; then
            echo "No audio file generated for today"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f audio/morning-brief.mp3 daily_audio.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily Hebrew audio briefing"
            git pull --rebase
            git push
          fi
