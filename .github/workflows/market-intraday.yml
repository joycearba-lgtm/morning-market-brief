name: Intraday Market Quotes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'intraday_market.py'
      - 'publish_market.py'
      - '.github/workflows/market-intraday.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: market-intraday
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Select market hours in Israel
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Jerusalem'))
          active = now.weekday() < 5 and now.hour >= 9
          active = active or '${{ github.event_name }}' != 'schedule'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('active=' + str(active).lower() + '\n')
          PY
      - name: Refresh quotes without changing the morning brief
        if: steps.window.outputs.active == 'true'
        run: python intraday_market.py
      - name: Publish quotes on latest main
        if: steps.window.outputs.active == 'true'
        run: python publish_market.py
      - name: Request GitHub Pages rebuild
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYBUILD'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages/builds'
          request = urllib.request.Request(url, data=b'{}', method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              print('Pages rebuild requested:', json.load(response).get('status'))
          PYBUILD
