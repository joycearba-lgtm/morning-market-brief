


name: Morning Market Brief

on:
  workflow_dispatch:
  schedule:
         - cron: '0 5 * * 0-5'
    - cron: '0 6 * * 0-5'
      

      

permissions:
  contents: write

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Confirm scheduled run
        run: |
          echo "Morning market workflow started"
          date -u
      - name: Check Israel time
        id: israel_time
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate market data
        if: steps.israel_time.outputs.run == 'true'
        run: python market_data.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update morning market data"
            git push
          fi  
