name: Morning Market Brief

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'market_data.py'
      - '.github/workflows/morning-brief.yml'
  schedule:
    # Israel 08:12: use 05:12 UTC (summer) / 06:12 UTC (winter)
    - cron: '12 5 * * 0-5'
    - cron: '12 6 * * 0-5'

permissions:
  contents: write

concurrency:
  group: morning-market-data
  cancel-in-progress: false

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Check local Israel hour
        id: israel_time
        shell: bash
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$HOUR" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate market data
        if: steps.israel_time.outputs.run == 'true'
        run: python market_data.py

      - name: Save updated data
        if: steps.israel_time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update morning market data"
            git pull --rebase
            git push
          fi
