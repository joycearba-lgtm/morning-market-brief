name: Morning Market Brief

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'market_data.py'
      - 'news_data.py'
      - 'generate_macro_brief.py'
      - 'market_editorial.py'
      - 'verify_daily.py'
      - 'official_macro_data.py'
      - 'israel_macro_data.py'
      - 'forecast_data.py'
      - 'economic_calendar.py'
      - 'macro_surprises.py'
      - '.github/workflows/morning-brief.yml'
  schedule:
    # Prepare before 08:00 Israel; select the UTC schedule by local offset, even if GitHub delays delivery
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'

permissions:
  contents: write

concurrency:
  group: morning-market-data
  cancel-in-progress: false

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Check local Israel hour
        id: israel_time
        shell: bash
        run: |
          OFFSET=$(TZ=Asia/Jerusalem date +%z)
          SCHEDULE="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$OFFSET" = "+0300" ] && [ "$SCHEDULE" = "30 4 * * *" ]; } || { [ "$OFFSET" = "+0200" ] && [ "$SCHEDULE" = "30 5 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate market data
        if: steps.israel_time.outputs.run == 'true'
        run: python market_data.py

      - name: Update sourced news headlines
        if: steps.israel_time.outputs.run == 'true'
        run: python news_data.py

      - name: Fetch official US macro indicators
        if: steps.israel_time.outputs.run == 'true'
        run: python official_macro_data.py

      - name: Fetch Israeli macro observations
        if: steps.israel_time.outputs.run == 'true'
        run: python israel_macro_data.py

      - name: Update one-year outlook
        if: steps.israel_time.outputs.run == 'true'
        run: python forecast_data.py

      - name: Build actual-versus-forecast comparisons
        if: steps.israel_time.outputs.run == 'true'
        run: python macro_surprises.py

      - name: Build macro release calendar
        if: steps.israel_time.outputs.run == 'true'
        run: python economic_calendar.py

      - name: Generate daily macro note
        if: steps.israel_time.outputs.run == 'true'
        run: python generate_macro_brief.py

      - name: Verify freshness and completeness
        if: steps.israel_time.outputs.run == 'true'
        run: python verify_daily.py

      - name: Save updated data
        if: steps.israel_time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json news_data.json macro_indicators.json israel_macro.json forecast_data.json economic_calendar.json macro_surprises.json macro_brief.json update_health.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update morning market data"
            git pull --rebase
            git push
          fi

