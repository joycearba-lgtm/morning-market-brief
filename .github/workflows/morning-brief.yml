


name: Morning Market Brief

on:
  workflow_dispatch:
  schedule:
     - cron: '0 8 * * 0-5'
      

      

permissions:
  contents: write

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Confirm scheduled run
        run: |
          echo "Morning market workflow started"
          date -u
        
      - name: Generate market data
        run: python market_data.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update morning market data"
            git push
          fi  
