

name: Morning Market Brief

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
      

permissions:
  contents: write

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Confirm scheduled run
        run: |
          echo "Morning market workflow started"
          date -u
